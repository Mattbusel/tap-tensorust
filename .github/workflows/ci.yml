name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 6 * * 1'  # weekly: catches API drift on the live endpoint
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.10' }
          - { os: ubuntu-24.04, python: '3.12' }
          - { os: ubuntu-24.04, python: '3.14' }
          - { os: windows-latest, python: '3.12' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: tests (standard SDK tap tests against the public API, keyless)
        run: python -m pytest -q
      - name: about
        run: tap-tensorust --about --format=json

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: ruff format --check .
      - run: ruff check .
