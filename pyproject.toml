[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tap-tensorust"
version = "0.1.0"
description = "Singer tap for Tensorust data: BDC private credit loan marks, lender disagreements, Q3 2026 markdowns, banned-vendor federal award exposure and the 145-dataset catalog"
readme = "docs/index.md"
license = { text = "MIT" }
authors = [{ name = "Matthew Busel" }]
requires-python = ">=3.10"
keywords = ["singer", "meltano", "meltano-sdk", "elt", "private-credit", "bdc", "tensorust"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["singer-sdk>=0.45,<1", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "singer-sdk[testing]>=0.45,<1", "ruff>=0.6"]

[project.urls]
Homepage = "https://tensorust.com"
Documentation = "https://github.com/Mattbusel/tap-tensorust/blob/main/docs/index.md"
Source = "https://github.com/Mattbusel/tap-tensorust"
"Data catalog" = "https://shop.tensorust.com/api/datasets"

[project.scripts]
tap-tensorust = "tap_tensorust.tap:TapTensorust.cli"

[tool.hatch.build.targets.wheel]
packages = ["tap_tensorust"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
